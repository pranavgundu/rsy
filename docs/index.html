<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>rsy paper</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #1d1a16;
        --panel: #fffaf0;
        --ink: #17130f;
        --muted: #695f52;
        --rule: #d8cdbb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: radial-gradient(circle at top, #4b4032, var(--bg) 48rem);
        color: var(--ink);
        font-family: "Times New Roman", Times, serif;
      }

      header {
        max-width: 1100px;
        margin: 0 auto;
        padding: 28px 22px 18px;
        color: #fff8e8;
      }

      h1 {
        margin: 0 0 6px;
        font-size: clamp(1.75rem, 4vw, 3rem);
        letter-spacing: -0.035em;
      }

      p {
        margin: 0;
        color: #e1d7c5;
        line-height: 1.45;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 16px;
      }

      a {
        color: inherit;
      }

      .button {
        display: inline-flex;
        align-items: center;
        min-height: 38px;
        padding: 8px 13px;
        border: 1px solid rgba(255, 248, 232, 0.42);
        border-radius: 999px;
        color: #fff8e8;
        text-decoration: none;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 0.9rem;
      }

      main {
        max-width: 1120px;
        margin: 0 auto 34px;
        padding: 0 20px 28px;
      }

      .frame {
        height: min(82vh, 1180px);
        min-height: 680px;
        border: 1px solid rgba(255, 248, 232, 0.22);
        border-radius: 14px;
        overflow: hidden;
        background: var(--panel);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.34);
      }

      object, iframe {
        width: 100%;
        height: 100%;
        border: 0;
        background: var(--panel);
      }

      .fallback {
        padding: 28px;
        color: var(--ink);
      }

      .fallback p {
        color: var(--muted);
      }

      code {
        padding: 0.12rem 0.28rem;
        border-radius: 4px;
        background: #eee4d3;
      }

      @media (max-width: 720px) {
        header {
          padding-top: 22px;
        }

        main {
          padding: 0;
        }

        .frame {
          height: calc(100vh - 170px);
          min-height: 520px;
          border-right: 0;
          border-left: 0;
          border-radius: 0;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>rsy: A Mathematical Note on Parallel File Synchronization</h1>
      <p>
        The website renders the actual LaTeX paper PDF. Source: <code>docs/rsy-paper.tex</code>.
        Rendered artifact: <code>docs/rsy-paper.pdf</code>.
      </p>
      <div class="actions">
        <a class="button" href="rsy-paper.pdf">Open PDF</a>
        <a class="button" href="rsy-paper.tex">View LaTeX Source</a>
      </div>
    </header>
    <main>
      <div class="frame">
        <object data="rsy-paper.pdf#view=FitH" type="application/pdf">
          <iframe src="rsy-paper.pdf#view=FitH" title="rsy LaTeX paper"></iframe>
          <div class="fallback">
            <h2>PDF preview unavailable</h2>
            <p>Your browser did not render the embedded PDF. Open <a href="rsy-paper.pdf">rsy-paper.pdf</a> directly.</p>
          </div>
        </object>
      </div>
    </main>
  </body>
</html>
