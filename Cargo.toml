[package]
name = "rsy"
version = "1.1.3"
edition = "2024"
description = "A blazing fast parallel copy tool for Unix"
license = "MIT"
repository = "https://github.com/pranavgundu/rsy"
keywords = ["rsync", "sync", "file-transfer", "backup", "delta"]
categories = ["command-line-utilities", "filesystem"]

[[bin]]
name = "rsy"
path = "src/main.rs"

[dependencies]
anyhow     = "1"
blake3     = "1"
byteorder  = "1"
clap       = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
crossterm         = "0.28"
ratatui           = "0.29"
filetime   = "0.2"
jwalk      = "0.8"
memmap2    = "0.9"
rayon      = "1"
rustc-hash = "2"
tracing    = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile  = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name    = "sync_vs_tools"
harness = false

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["fs", "user"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2"

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = true

[profile.dev]
opt-level = 1
